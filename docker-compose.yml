services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      BIFROST_URL: http://bifrost:8080/v1  # agents' OPENAI_BASE_URL; the runner adds this host to NO_PROXY
    env_file:
      - path: .env
        required: false

  bifrost:
    image: maximhq/bifrost
    ports:
      - "8080:8080"
    volumes:
      - ./bifrost:/app/data  # config.json in, Bifrost's SQLite stores out (gitignored)
    env_file:
      - path: .env
        required: false
