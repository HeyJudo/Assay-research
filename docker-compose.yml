services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      BIFROST_URL: http://bifrost:8080/v1  # agents' OPENAI_BASE_URL; the runner adds this host to NO_PROXY
    env_file:
      - path: .env
        required: false
    volumes:
      - assay-state:/app/state  # assay.db survives `docker compose down` and rebuilds
    depends_on:
      - bifrost

  bifrost:
    image: maximhq/bifrost@sha256:b5258c5f11c79064fc8280e49513f54c0b1da81c78bd11d3b4c1f62f8926d1ab  # same digest as the Dockerfile's bundled copy
    ports:
      - "127.0.0.1:8080:8080"  # dashboard + admin API: localhost only, never the venue Wi-Fi
    volumes:
      - ./bifrost:/app/data  # config.json in, Bifrost's SQLite stores out (gitignored)
    env_file:
      - path: .env
        required: false

volumes:
  assay-state:
